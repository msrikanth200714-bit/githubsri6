<!DOCTYPE html>
<html>
<head>
    <title>Simple JS Example</title>
</head>
<body>
    <h1>Click the button!</h1>
    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("Hello! You just clicked the button.");
        }
    </script>
</body>
</html>
